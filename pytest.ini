[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow and not eval"
markers =
    slow: integration tests that load real models (pyannote, whisper) — skipped by default. Run with `-m slow` or `-m ""`.
    eval: tests that need a real DB snapshot and the e5 embedding model (evals/gate.py end-to-end) — skipped by default. Run with `-m eval`.
filterwarnings =
    ignore::DeprecationWarning
