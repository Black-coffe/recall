[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow"
markers =
    slow: integration tests that load real models (pyannote, whisper) — skipped by default. Run with `-m slow` or `-m ""`.
filterwarnings =
    ignore::DeprecationWarning
