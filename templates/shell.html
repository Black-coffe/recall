<!DOCTYPE html>
<html lang="uk" data-ui-lang="{{ ui_lang|default('auto') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="core.shell.title">Recall — архів памʼяті</title>
    <meta name="description" data-i18n-content="core.shell.description" content="Recall — особистий архів памʼяті: дзвінки, файли, документи, Telegram. Семантичний пошук і звʼязки.">

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <!-- Fonts: Fraunces (display serif), Inter (UI), IBM Plex Mono (provenance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recall.css') }}">
</head>
<body>
    <div class="rc-app rc-shell" id="rcApp">

        <!-- ====================== SIDEBAR ====================== -->
        <aside class="rc-sidebar" id="rcSidebar">
            <div class="rc-brand">
                <span class="rc-brand__mark">Recall</span>
                <span class="rc-brand__sub" data-i18n="core.shell.brandSub">архів</span>
            </div>

            <nav class="rc-nav" id="rcNav" aria-label="Основна навігація" data-i18n-aria-label="core.nav.mainAria">
                <a class="rc-nav__item" href="/" data-route="home">
                    <i class="rc-ico fa-solid fa-house"></i> <span data-i18n="core.nav.home">Головна</span>
                </a>
                <a class="rc-nav__item" href="/library" data-route="library">
                    <i class="rc-ico fa-solid fa-layer-group"></i> <span data-i18n="core.nav.library">Бібліотека</span>
                    <span class="rc-nav__count" data-count="library"></span>
                </a>
                <a class="rc-nav__item" href="/audio" data-route="audio">
                    <i class="rc-ico fa-solid fa-compact-disc"></i> <span data-i18n="core.nav.media">Медіатека</span>
                </a>
                <a class="rc-nav__item" href="/ask" data-route="ask">
                    <i class="rc-ico fa-solid fa-comments"></i> <span data-i18n="core.nav.ask">Запитай архів</span>
                </a>
                <a class="rc-nav__item" href="/research" data-route="research">
                    <i class="rc-ico fa-solid fa-magnifying-glass-chart"></i> <span data-i18n="core.nav.research">Дослідження</span>
                </a>
                <a class="rc-nav__item" href="/entities" data-route="entities">
                    <i class="rc-ico fa-solid fa-diagram-project"></i> <span data-i18n="core.nav.entities">Сутності</span>
                    <span class="rc-nav__count" data-count="entities"></span>
                </a>
                <a class="rc-nav__item" href="/tasks" data-route="tasks">
                    <i class="rc-ico fa-solid fa-list-check"></i> <span data-i18n="core.nav.tasks">Задачі</span>
                    <span class="rc-nav__count" data-count="tasks"></span>
                </a>
                <a class="rc-nav__item" href="/comments" data-route="comments">
                    <i class="rc-ico fa-regular fa-comment-dots"></i> <span data-i18n="core.nav.comments">Коментарі</span>
                </a>
                <a class="rc-nav__item" href="/speakers" data-route="speakers">
                    <i class="rc-ico fa-solid fa-users"></i> <span data-i18n="core.nav.speakers">Спікери</span>
                </a>

                <div class="rc-nav__group-label" data-i18n="core.nav.addGroup">Додати у архів</div>
                <a class="rc-nav__item" href="/upload" data-route="upload">
                    <i class="rc-ico fa-solid fa-arrow-up-from-bracket"></i> <span data-i18n="core.nav.upload">Завантажити файл</span>
                </a>
                <a class="rc-nav__item" href="/youtube" data-route="youtube">
                    <i class="rc-ico fa-brands fa-youtube"></i> <span>YouTube</span>
                </a>
                <a class="rc-nav__item" href="/documents" data-route="documents">
                    <i class="rc-ico fa-solid fa-file-lines"></i> <span data-i18n="core.nav.documents">Документи</span>
                </a>
                <a class="rc-nav__item" href="/telegram" data-route="telegram">
                    <i class="rc-ico fa-brands fa-telegram"></i> <span>Telegram</span>
                </a>
                <a class="rc-nav__item" href="/record" data-route="record">
                    <i class="rc-ico fa-solid fa-microphone"></i> <span data-i18n="core.nav.record">Запис</span>
                </a>
            </nav>

            <div class="rc-sidebar__spacer"></div>

            <nav class="rc-nav" aria-label="Сервіс" data-i18n-aria-label="core.nav.serviceAria">
                <a class="rc-nav__item" href="/settings" data-route="settings">
                    <i class="rc-ico fa-solid fa-sliders"></i> <span data-i18n="core.nav.settings">Налаштування</span>
                </a>
            </nav>
        </aside>

        <!-- ====================== MAIN ====================== -->
        <div class="rc-main">
            <header class="rc-topbar">
                <button class="rc-iconbtn rc-burger" id="rcBurger" aria-label="Меню" data-i18n-aria-label="core.shell.menu"><i class="fa-solid fa-bars"></i></button>
                <button class="rc-cmdk-trigger" id="rcCmdkTrigger" aria-label="Команди та пошук" data-i18n-aria-label="core.shell.cmdkAria">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span data-i18n="core.shell.cmdkTrigger">Спитати архів або перейти…</span>
                    <kbd>⌘K</kbd>
                </button>
                <div class="rc-topbar__spacer"></div>
                <div class="rc-topbar__actions">
                    <div class="rc-conn" id="rcConn" data-state="online" title="З’єднання із сервером у нормі" data-i18n-title="core.conn.onlineTitle">
                        <span class="rc-conn__dot"></span>
                        <span class="rc-conn__label" data-i18n="core.conn.online">Онлайн</span>
                    </div>
                    <button class="rc-iconbtn" id="rcOnbTrigger" type="button" title="Показати онбординг знову" data-i18n-title="core.shell.onbShow"><i class="fa-solid fa-graduation-cap"></i></button>
                    <a class="rc-iconbtn" href="/ask" data-route="ask" title="Запитай архів" data-i18n-title="core.nav.ask"><i class="fa-solid fa-comments"></i></a>
                    <a class="rc-iconbtn" href="/settings" data-route="settings" title="Налаштування" data-i18n-title="core.nav.settings"><i class="fa-solid fa-sliders"></i></a>
                </div>
            </header>

            <main class="rc-content" id="rcContent">
                <div class="rc-view" id="view"><!-- router renders here --></div>
            </main>
        </div>
    </div>

    <div class="rc-toasts" id="rcToasts"></div>

    <!-- ====================== SCRIPTS (dependency order) ====================== -->
    <script src="{{ url_for('static', filename='js/recall/namespace.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/capture.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/transcript.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/library.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/knowledge.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/i18n/telegram.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/util.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/research_export.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/comments.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/library.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/audio.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/transcript.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/ask.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/research.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/entities.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/speakers.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/tasks.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/comments.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/youtube.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/upload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/documents.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/telegram.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/record.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/views/home.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/shell.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/onboarding.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/cmdk.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recall/router.js') }}"></script>
</body>
</html>
